<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Good Jar launch graphic</title>
  <desc id="desc">A warm illustrated launch announcement for Good Jar with a jar icon and the message Small habits, meaningful rewards.</desc>
  <rect width="1080" height="1350" fill="#f7f3eb"/>
  <circle cx="910" cy="190" r="150" fill="#dcece3"/>
  <circle cx="122" cy="1180" r="210" fill="#f6d6c9"/>
  <g transform="translate(390 175)">
    <rect x="60" y="0" width="180" height="22" rx="11" fill="#292721"/>
    <path d="M20 65 Q20 42 44 42 H256 Q280 42 280 65 L286 284 Q288 345 247 383 Q210 418 150 418 Q90 418 53 383 Q12 345 14 284 Z" fill="#fffdf8" stroke="#292721" stroke-width="18"/>
    <path d="M150 158 C164 197 177 210 216 224 C177 238 164 251 150 290 C136 251 123 238 84 224 C123 210 136 197 150 158Z" fill="#ef755f"/>
  </g>
  <text x="540" y="730" text-anchor="middle" fill="#2e6553" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="700" letter-spacing="5">GOOD JAR IS HERE</text>
  <text x="540" y="835" text-anchor="middle" fill="#292721" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700">Small habits.</text>
  <text x="540" y="925" text-anchor="middle" fill="#292721" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700">Meaningful rewards.</text>
  <text x="540" y="1010" text-anchor="middle" fill="#6e6a61" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="34">Build momentum. Fill your jar.</text>
  <g transform="translate(320 1080)">
    <rect width="440" height="86" rx="43" fill="#2e6553"/>
    <text x="220" y="55" text-anchor="middle" fill="#fffdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="700">Available on the App Store</text>
  </g>
  <text x="540" y="1260" text-anchor="middle" fill="#6e6a61" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28">good-jar.com</text>
</svg>
